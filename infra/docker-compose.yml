version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: washflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: washflow
      POSTGRES_PASSWORD: washflow
      POSTGRES_DB: washflow
    ports:
      - "5433:5432"
    volumes:
      - washflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washflow -d washflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: washflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@washflow.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - washflow-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  washflow-postgres-data:
    name: washflow-postgres-data
  washflow-pgadmin-data:
    name: washflow-pgadmin-data
