version: '3.8'

# Docker Compose configuration for running tests with PostgreSQL
# Usage: docker compose -f docker-compose.test.yml up -d

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: washflow-db-test
    restart: "no"
    environment:
      POSTGRES_USER: washflow_test
      POSTGRES_PASSWORD: washflow_test
      POSTGRES_DB: washflow_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data  # Use RAM for faster tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washflow_test -d washflow_test"]
      interval: 2s
      timeout: 2s
      retries: 10
    command: >
      postgres
        -c fsync=off
        -c synchronous_commit=off
        -c full_page_writes=off
        -c random_page_cost=1.0
